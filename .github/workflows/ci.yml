name: CI

# Build on every push to main and on EVERY pull request, whatever its base. Keeps
# the release path (release.yml) lean — this catches build regressions
# continuously, not only at release time.
#
# `pull_request` deliberately carries NO `branches:` filter. Stacked PRs are the
# working pattern here — a PR based on a feature or integration branch, not main —
# and `branches: [main]` gave those runs NO checks at all (measured: `gh pr checks
# 95` reported none), silently dropping the gate from exactly the code that is
# still moving. Any explicit list would have to be extended for every new base
# branch, and a base someone forgets fails OPEN — no CI, no failure, no signal.
# Omitting the filter cannot silently omit anything. A full run is ~3 minutes and
# the concurrency group below cancels superseded runs.
#
# `push` stays pinned to main on purpose: a feature branch's commits are already
# covered by its PR, so widening it would run everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    # Hard cap on the WHOLE job, not just the steps we suspect. Four runs have been
    # killed at GitHub's 6-hour default (31604846111, 31613727149, 31681038697,
    # 31681726552) — that is ~19 runner-hours burnt for no signal. A healthy run is
    # 2m48s end to end (31603783879), so 20 minutes is generous even on a cold NuGet
    # cache. Per-step caps below name the phase; this one guarantees the bound holds
    # for any step, including ones added later without a cap of their own.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ProjectReference to ZeroZero.Brand.WinUI uses a relative path expecting a
      # sibling checkout (..\0z0-shared\src\...) — locally that's a sibling
      # folder. actions/checkout refuses a `path:` outside the workspace
      # ("not under D:\a\ChargeKeeper\ChargeKeeper"), so clone the (public) repo
      # directly beside this checkout instead. (Repo was renamed ZeroZeroBrand → 0z0-shared.)
      #
      # No ref is named, so the clone lands on whatever branch the remote advertises as its
      # default and the build resolves the library as it currently stands. A structural change
      # in 0z0-shared therefore reaches this workflow without ChargeKeeper being touched; the
      # arrangement and its notice rule are described in README under "Shared components".
      - name: Clone 0z0-shared (sibling dependency, default branch)
        shell: pwsh
        run: |
          git clone https://github.com/0z00z0/0z0-shared.git ../0z0-shared
          Write-Host "0z0-shared at $(git -C ../0z0-shared rev-parse --abbrev-ref HEAD) ($(git -C ../0z0-shared rev-parse --short HEAD))"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # The app targets win-x64 with ReadyToRun on Release, which needs the
      # win-x64 runtime pack — restore/build must specify the RID (NETSDK1112).
      #
      # Measured 55-66 s and 42-48 s respectively across every run since 2026-08-12,
      # healthy and hung alike; 5 minutes each is ~5x headroom. They carry their own
      # caps so a stall here is reported against the step rather than silently
      # consuming the job budget that the test phase needs.
      - name: Restore
        timeout-minutes: 5
        run: dotnet restore ChargeKeeper.csproj -r win-x64

      - name: Build (Release)
        timeout-minutes: 5
        run: dotnet build ChargeKeeper.csproj -c Release -r win-x64 --no-restore --nologo

      # Restore/Build above are scoped to ChargeKeeper.csproj, so the test project
      # is not built by them and needs its own restore (--no-restore here fails with
      # NETSDK1004, no assets file). Split into three timed steps so a stall names
      # its phase instead of burning the job's 6-hour cap anonymously (run 31613727149:
      # 5h57m38s in a step the local machine runs in ~1 s).
      #
      # No -r on these: a command-line RID is a GLOBAL property and would override the
      # empty <RuntimeIdentifier> that ChargeKeeper.Tests.csproj pins on purpose. The app
      # project defaults its own RID (win-<arch>) when none is passed, so the win-x64
      # runtime pack is still restored here and Release/ReadyToRun keeps its pack (NETSDK1112).
      # THE FIX for the six-hour hang (#91). The test host loads ChargeKeeper.dll, and that
      # assembly's <Module>..cctor P/Invokes MddBootstrapInitialize2 to locate a Windows App
      # Runtime. A GitHub runner has none, and the bootstrapper's default is
      # InitializeOptions.OnNoMatch_ShowUI — so it raises a modal "install it" prompt on a
      # session with no interactive desktop and NEVER RETURNS, while holding the module
      # type-init lock every other test thread queues behind. Give the runner the runtime and
      # the call returns immediately (789 ms on a dev machine, which is why it never
      # reproduced locally).
      #
      # Chosen over -p:WindowsAppSdkBootstrapInitialize=false because it introduces NO build
      # divergence: the assembly the gate tests stays byte-identical to the one release.yml
      # signs and ships. Suppressing the initializer would rewrite bin\ ChargeKeeper.dll
      # without it, and in release.yml risk shipping an exe that cannot start.
      #
      # PINNED to 2.2.0 to match <PackageReference Include="Microsoft.WindowsAppSDK"
      # Version="2.2.0" /> in ChargeKeeper.csproj — the runtime the bootstrapper asks for
      # (Microsoft.WindowsAppSDK.Runtime 2.2.0's WindowsAppSDK-VersionInfo.cs: framework
      # package family Microsoft.WindowsAppRuntime.2, version 2.2.0.0). Not `latest`: that
      # aka.ms link already resolves to a DIFFERENT, larger build, so `latest` would silently
      # drift the runtime out of step with the SDK the app compiles against. Bump both
      # together.
      #
      # The SHA256 is the measured hash of that pinned download. It makes a re-published
      # binary at the same version fail here by name instead of changing the gate's
      # environment silently; if it ever fires, re-verify the download and update the hash.
      - name: Install Windows App Runtime 2.2.0 (x64)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $url    = 'https://aka.ms/windowsappsdk/2.2/2.2.0/windowsappruntimeinstall-x64.exe'
          $sha256 = 'E14ABFEEDD61CCF1E1B9618A9D4E8E5CAD6B6A0BECBACF159A50718D047EB927'
          $exe    = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'

          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToUpper()
          if ($actual -ne $sha256) {
            throw "WindowsAppRuntimeInstall-x64.exe SHA256 is $actual, expected $sha256. Refusing to run an unexpected binary."
          }

          # Inventory before and after. The DELTA is the record of what the install actually
          # changed — better evidence than the installer's own text, and the first thing worth
          # reading if the hang ever comes back. It is not decoration: the runner image already
          # ships a framework package (2.3.1.0 in run 31874075888), so "a package exists" alone
          # proves nothing about whether this step did anything.
          function Show-Runtime([string]$when) {
            Write-Host "Windows App Runtime packages $when :"
            $all = Get-AppxPackage | Where-Object { $_.Name -like '*WindowsAppRuntime*' -or $_.Name -like '*WinAppRuntime*' }
            if (-not $all) { Write-Host '  (none)' }
            else { $all | Sort-Object Name, Architecture | ForEach-Object { Write-Host "  $($_.Name) $($_.Version) $($_.Architecture)" } }
          }
          Show-Runtime 'BEFORE'

          & $exe --quiet
          if ($LASTEXITCODE -ne 0) { throw "WindowsAppRuntimeInstall failed (exit 0x$('{0:X}' -f $LASTEXITCODE))." }

          Show-Runtime 'AFTER'

          # Assert the bootstrapper's OWN requirement, not merely that something is installed:
          # MddBootstrapInitialize2 asks family Microsoft.WindowsAppRuntime.2 for a framework
          # package of at least 2.2.0.0 for this process architecture. Anything weaker passes on
          # an image that happens to carry an unrelated runtime and would let a silent no-op put
          # the six-hour hang straight back.
          $fw = Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.2' |
                Where-Object { $_.Architecture -eq 'X64' -and [version]$_.Version -ge [version]'2.2.0.0' }
          if (-not $fw) {
            throw 'No x64 Microsoft.WindowsAppRuntime.2 framework package >= 2.2.0.0 is registered after install.'
          }
          Write-Host "OK  bootstrap requirement satisfied by $($fw[0].Name) $($fw[0].Version) x64"

      - name: Restore tests
        timeout-minutes: 10
        run: dotnet restore Tests\ChargeKeeper.Tests.csproj

      - name: Build tests (Release)
        timeout-minutes: 10
        run: dotnet build Tests\ChargeKeeper.Tests.csproj -c Release --no-restore --nologo

      # This is the step that hung for 5h57m38s (run 31613727149); the runtime install above
      # is what unblocks it. The auto-initializer lives in ChargeKeeper.dll, NOT in
      # ChargeKeeper.Tests.dll — measured on the built assemblies: only ChargeKeeper.dll has a
      # <Module>..cctor, and only it carries
      # Microsoft.Windows.ApplicationModel.WindowsAppRuntime.Common.AutoInitialize
      # .InitializeWindowsAppSDK marked [ModuleInitializer]. The WinUI targets inject it where
      # WindowsPackageType == None and OutputType is Exe/WinExe, which is ChargeKeeper.csproj;
      # the test project sets no WindowsPackageType, so it never gets one. Creating a test
      # class touches a ChargeKeeper type, which runs the APP module's cctor. That is why no
      # property inside ChargeKeeper.Tests.csproj could have fixed this.
      #
      # --blame-hang stays: it is what ended the six hours and wrote the dump the diagnosis
      # came from, and it is the only thing that bounds a host that stalls rather than dies (a
      # plain step timeout could only say "cancelled"). --blame-crash covers the other shape of
      # the same silence; its ABSENCE here was evidence too.
      - name: Test
        timeout-minutes: 10
        run: dotnet test Tests\ChargeKeeper.Tests.csproj -c Release --no-build --nologo --blame-hang --blame-hang-timeout 3m --blame-crash

      # The dumps live on the runner and vanish with it, so a hang would still be
      # undiagnosable. Keep them whenever the gate does not pass.
      - name: Upload blame dumps
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-blame-dumps
          path: Tests/TestResults/**
          if-no-files-found: ignore
          retention-days: 7

  # The installer script is Pascal inside a preprocessed text file, and nothing in the ordinary
  # build looked at it: ci.yml never ran ISCC, so installer\ChargeKeeper.iss was compiled for the
  # first time by the release workflow, on a tag, with no way back. That is how a preprocessor
  # collision reached v1.34.0 and stopped the release - five continuation lines beginning with a
  # Pascal #13#10 literal, which ISPP claims as directives of its own (measured: ISCC 6.7.3 exits
  # 2 with "Unknown preprocessor directive" on the first of them, and 0 once they are fixed).
  #
  # This job compiles the script on every push and pull request. It does NOT publish the app: the
  # only thing [Files] needs is a folder to glob, so a stub holding one dummy file is enough for
  # ISCC to preprocess the whole file and compile the entire [Code] section. Any script error -
  # an unknown directive, an unbalanced #if, a Pascal syntax error, a missing wizard image or
  # setup icon - fails here in under a minute instead of on the tag. What it cannot catch is an
  # error that depends on the real publish output, since the stub has none.
  #
  # Separate job on purpose: it needs no .NET, no shared-library clone and no Windows App Runtime,
  # so it runs beside the build rather than lengthening it.
  installer-script:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same source as release.yml, so the compiler that gates here is the compiler that ships.
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer script
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc." }

          # [Files] globs {#PublishDir}\* and Inno rejects a pattern that matches nothing, so give
          # it one file. The contents are irrelevant - no installer is run and none is kept.
          $stub = Join-Path $env:RUNNER_TEMP 'stub-publish'
          $out  = Join-Path $env:RUNNER_TEMP 'iss-out'
          New-Item -ItemType Directory -Force -Path $stub, $out | Out-Null
          Set-Content -Path (Join-Path $stub 'ChargeKeeper.exe') -Value 'stub' -NoNewline

          # The same two defines build-installer.ps1 passes, so this compiles the identical path.
          & $iscc "/DAppVersion=0.0.0" "/DPublishDir=$stub" "/O$out" installer\ChargeKeeper.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE): installer\ChargeKeeper.iss does not compile." }

          # Assert an installer was actually produced. A compiler that exits 0 having written
          # nothing would leave this gate green while proving nothing.
          $setup = Join-Path $out 'ChargeKeeper-Setup-0.0.0.exe'
          if (-not (Test-Path $setup)) { throw "ISCC exited 0 but produced no $setup." }
          Write-Host "OK  installer script compiles ($((Get-Item $setup).Length) bytes)"