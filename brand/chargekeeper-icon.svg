<?xml version="1.0" encoding="UTF-8"?>
<!--
  ChargeKeeper app icon — "0z0 steel battery".

  A flat, squared battery outline in muted SteelBlue, with a Sage-green interior fill and a
  Terracotta vertical "guard" line crossing the body — ChargeKeeper's own product palette
  (== GaugePalette SteelBlue / SageGreen / Terracotta). No gradients: flat geometric shapes,
  matching the ZeroZero "0z0 geometric" studio look. Fully transparent background — no
  background plate — scaled to fill the canvas (matching modern Windows 11 icon conventions,
  where the shell supplies its own rounded-square mask/backdrop rather than the app baking one in).

  Proportions: landscape. Body, cap and guard are centred on y = 128; the ink spans 48 % of the
  256-unit canvas with the guard line and 37 % on the body alone, against 91 % of its width. The
  interior band is the body's inner rect inset by ~14 units on every side.

  This file is the authoritative vector. There is no SVG rasteriser on the build machine, so nothing
  consumes it directly; it is transcribed into GDI+ geometry in two places, and a change here is not
  real until both follow:

    scripts\BatteryGlyph.ps1    — shared by scripts\make-appicon.ps1 (Assets\AppIcon.ico/.png,
                                  Assets\SetupIcon.ico) and installer\make-wizard-images.ps1
                                  (the wizard banners). Re-run both after editing.
    Helpers\IconGenerator.cs    — redraws it at runtime, as MarkHeights.AppIconHeights. Separate
                                  copy by necessity (in-process C#); see its RenderMarkBitmap remarks.

  The LIVE TRAY ICON does not use these proportions. Its slot is square and as little as 16 px
  across, where a landscape mark letterboxes away half the frame, so IconGenerator carries a second
  height set — TraySlotHeights — with the vertical figures scaled 1.6x about y = 128. That set is
  the tray's alone; propagating it back here is what made the app, setup and wizard marks chubby.

  Tests\BrandMarkGeometryTests.cs pins this file to IconGenerator's AppIconHeights and to
  BatteryGlyph.ps1, and separately pins TraySlotHeights, so neither the three representations nor
  the two height sets can drift or be re-merged silently. It parses the attributes below — keep
  every figure a literal number on the element it belongs to rather than folding it into a transform
  or a path.

  The runtime renderer also lays a soft dark halo under the guard line, widening with the taskbar's
  light/dark setting so a 16 px frame keeps a readable edge. That is a small-size legibility device,
  not part of the mark, and is deliberately absent here.
-->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Battery body outline: flat SteelBlue, round line-join. Outer edge y 73.5..182.5. -->
  <rect x="15" y="80" width="191" height="96" rx="6"
        fill="none" stroke="#7FA8B8" stroke-width="13" stroke-linejoin="round"/>

  <!-- Battery cap (positive terminal): solid SteelBlue -->
  <rect x="221" y="106" width="20" height="44" rx="3" fill="#7FA8B8"/>

  <!-- Interior charge fill: Sage green at alpha 230/255. The interior band runs x 36..185; this
       rect ends at 149.24, i.e. 76 % across it — the canonical charge level the static icon uses.
       76 rather than the 74 the band's midpoint would give: 74 falls in the amber tier. -->
  <rect x="36" y="101" width="113.24" height="55" rx="3" fill="#7AB88F" opacity="0.902"/>

  <!-- Terracotta guard line crossing the body (flat/butt caps), at 84 % across the interior band.
       It overhangs the body top and bottom, so y 66..190 is the mark's full ink height. -->
  <line x1="161.16" y1="66" x2="161.16" y2="190" stroke="#C9926B" stroke-width="9"/>
</svg>
